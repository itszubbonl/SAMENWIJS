<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ed">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none';">
  <title>SAMENWIJS</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f3ed;
      --surface: #ffffff;
      --ink: #20312d;
      --muted: #4d5d57;
      --green: #286457;
      --green-dark: #164b40;
      --soft: #eaf1ec;
      --line: #c9d7cf;
      --focus: #174fdf;
      --scale: 1;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-size: calc(18px * var(--scale));
      line-height: 1.55;
      -webkit-tap-highlight-color: transparent;
    }
    body.high-contrast {
      --page: #fff;
      --surface: #fff;
      --ink: #101010;
      --muted: #222;
      --green: #00473b;
      --green-dark: #00382f;
      --soft: #e9f4f0;
      --line: #202020;
      --focus: #003cff;
    }
    body.dark-mode:not(.high-contrast) {
      --page: #17221f;
      --surface: #202d29;
      --ink: #f4f4ef;
      --muted: #d0d8d3;
      --green: #88c8b4;
      --green-dark: #b5e2d3;
      --soft: #2c3b36;
      --line: #53635c;
      --focus: #9db9ff;
    }
    button, input, textarea { font: inherit; }
    button {
      min-height: 52px;
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 10px 16px;
      color: var(--green-dark);
      background: var(--soft);
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    button.primary { color: #fff; background: var(--green); border-color: var(--green); }
    button.primary:active { background: var(--green-dark); }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    button:disabled { opacity: .5; cursor: default; }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 720px;
      margin: auto;
      padding: 10px 18px 4px;
    }
    .brand { font-size: calc(23px * var(--scale)); font-weight: 800; letter-spacing: -.02em; }
    .brand-mark { color: var(--green); font-size: .68em; vertical-align: .12em; }
    .settings-button { min-height: 46px; padding: 7px 12px; font-size: calc(15px * var(--scale)); }
    main {
      width: 100%;
      max-width: 720px;
      min-height: calc(100dvh - 145px);
      margin: 0 auto;
      padding: 10px 18px 112px;
    }
    h1 { margin: 5px 0 4px; font-size: calc(29px * var(--scale)); line-height: 1.2; }
    h2 { margin: 0 0 5px; font-size: calc(21px * var(--scale)); line-height: 1.3; }
    h3 { margin: 0 0 5px; font-size: calc(18px * var(--scale)); }
    p { margin: 5px 0 10px; }
    .intro { margin-top: 4px; color: var(--muted); }
    .muted { color: var(--muted); }
    .small { font-size: calc(15px * var(--scale)); }
    .card {
      margin-top: 13px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(20, 46, 37, .04);
    }
    .card > button { width: 100%; margin-top: 9px; }
    .big-value { margin: 8px 0; font-size: calc(24px * var(--scale)); font-weight: 800; line-height: 1.25; }
    .progress-track { height: 14px; margin-top: 12px; overflow: hidden; border-radius: 99px; background: var(--soft); }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--green); }
    .list { display: grid; gap: 10px; margin-top: 12px; }
    .plan-item { padding: 14px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
    .plan-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .time { min-width: 54px; color: var(--green-dark); font-weight: 800; }
    .plan-name { font-size: calc(19px * var(--scale)); font-weight: 750; overflow-wrap: anywhere; }
    .button-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .button-row button { flex: 1 1 115px; min-height: 48px; padding: 8px 10px; font-size: calc(15px * var(--scale)); }
    .task-step {
      display: grid;
      min-height: 150px;
      place-items: center start;
      margin: 15px 0 8px;
      padding: 14px;
      border-radius: 18px;
      background: var(--soft);
      font-size: calc(27px * var(--scale));
      font-weight: 800;
      line-height: 1.3;
    }
    .task-progress { height: 12px; border-radius: 20px; background: var(--soft); overflow: hidden; }
    .task-progress > span { display: block; height: 100%; background: var(--green); }
    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 10px; }
    .choice-grid button { min-height: 62px; text-align: center; }
    button[aria-pressed="true"] { outline: 3px solid var(--green); outline-offset: 2px; }
    .help-copy { padding: 14px; border-left: 5px solid var(--green); border-radius: 8px; background: var(--soft); }
    .help-copy p { margin: 0 0 8px; }
    .help-copy p:last-child { margin-bottom: 0; }
    .nav-wrap {
      position: fixed;
      z-index: 5;
      right: 0; bottom: 0; left: 0;
      padding: 7px 6px max(8px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      width: 100%;
      max-width: 720px;
      margin: auto;
    }
    nav button {
      min-width: 0;
      min-height: 56px;
      padding: 6px 2px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: transparent;
      font-size: calc(13px * var(--scale));
      line-height: 1.15;
      text-align: center;
      overflow-wrap: anywhere;
    }
    nav button[aria-current="page"] { border-color: var(--line); background: var(--soft); color: var(--green-dark); }
    .overlay {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(16, 28, 24, .55);
    }
    .dialog {
      width: min(100%, 560px);
      max-height: min(90dvh, 760px);
      overflow: auto;
      padding: 18px;
      border: 2px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 10px 44px rgba(0, 0, 0, .22);
    }
    .dialog h2 { font-size: calc(23px * var(--scale)); }
    .dialog button { width: 100%; margin-top: 9px; }
    .field { display: grid; gap: 4px; margin-top: 12px; font-weight: 700; }
    .field input, .field textarea {
      width: 100%;
      min-height: 50px;
      padding: 10px 12px;
      border: 2px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: var(--surface);
    }
    .field select { width: 100%; min-height: 50px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; color: var(--ink); background: var(--surface); font: inherit; }
    .field textarea { min-height: 92px; resize: vertical; }
    .radio-row { display: grid; gap: 8px; margin: 10px 0; }
    .radio-row label, .check-row { display: flex; align-items: center; gap: 10px; min-height: 48px; }
    input[type="radio"], input[type="checkbox"] { width: 23px; height: 23px; accent-color: var(--green); }
    .status { min-height: 24px; margin-top: 10px; color: var(--green-dark); font-weight: 700; }
    .breath-word { display: grid; min-height: 130px; place-items: center; margin: 12px 0; border-radius: 18px; background: var(--soft); text-align: center; font-size: calc(30px * var(--scale)); font-weight: 800; }
    .breath-time { text-align: center; font-size: calc(20px * var(--scale)); }
    .warning { border-left: 5px solid #9b4a26; }
    .footer-note { margin: 16px 2px; }
    .callout { padding: 14px; border-radius: 16px; background: var(--soft); }
    .date-controls { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 7px; align-items: center; margin: 12px 0; }
    .date-controls button { min-height: 48px; padding: 7px; text-align: center; }
    .date-controls input { min-width: 0; width: 100%; min-height: 48px; padding: 7px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; }
    .plan-meta { margin: 5px 0; color: var(--muted); font-size: calc(15px * var(--scale)); }
    .tag { display: inline-block; margin: 4px 4px 4px 0; padding: 3px 9px; border-radius: 99px; background: var(--soft); color: var(--green-dark); font-size: calc(14px * var(--scale)); font-weight: 700; }
    .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 10px; }
    .tool-grid button { min-height: 66px; text-align: center; }
    .step-list { padding-left: 24px; }
    .step-list li { margin: 8px 0; }
    .divider { height: 1px; margin: 12px 0; background: var(--line); }
    .large-choice { min-height: 74px !important; font-size: calc(19px * var(--scale)); }
    .text-option { display: block; padding: 10px 12px; border-radius: 12px; background: var(--soft); margin: 7px 0; }
    .day-summary { display: flex; flex-wrap: wrap; gap: 8px; }
    @media (min-width: 640px) {
      main { padding-left: 24px; padding-right: 24px; }
      .app-header { padding-left: 24px; padding-right: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">SAMENWIJS <span class="brand-mark" aria-hidden="true">●</span></div>
    <button id="settings-open" class="settings-button" type="button">Instellingen</button>
  </header>
  <main id="main" aria-live="polite"></main>
  <div class="nav-wrap">
    <nav aria-label="Hoofdnavigatie">
      <button type="button" data-page="today">Vandaag</button>
      <button type="button" data-page="day">Mijn dag</button>
      <button type="button" data-page="skills">Leren</button>
      <button type="button" data-page="rest">Rust</button>
      <button type="button" data-page="together">Samen</button>
    </nav>
  </div>
  <div id="dialog-root"></div>
  <script>
    (function () {
      "use strict";
      var STORAGE_KEY = "samenwijs-v1";
      var examplePlan = [
        { time: "08:30", title: "Ontbijten", done: false },
        { time: "10:00", title: "Mijn activiteit", done: false },
        { time: "12:30", title: "Lunchen", done: false },
        { time: "16:00", title: "Rustmoment", done: false },
        { time: "18:00", title: "Avondeten", done: false }
      ];
      var templates = [
        { category: "Voor jezelf zorgen", title: "Tanden poetsen", steps: ["Pak je tandenborstel.", "Maak de borstel nat.", "Doe een beetje tandpasta op de borstel.", "Poets je tanden rustig.", "Spoel je mond en maak de borstel schoon."] },
        { category: "Voor jezelf zorgen", title: "Douchen", steps: ["Leg je handdoek en schone kleren klaar.", "Zet de douche aan. Kies een fijne temperatuur.", "Maak je lichaam en haren nat.", "Was jezelf met zeep of shampoo.", "Spoel alles af en droog jezelf af."] },
        { category: "Voor jezelf zorgen", title: "Aankleden", steps: ["Kies kleren die fijn zitten.", "Leg de kleren klaar.", "Trek je ondergoed aan.", "Trek je kleren aan.", "Kijk of je warm genoeg bent."] },
        { category: "Eten en drinken", title: "Een boterham maken", steps: ["Pak een bord, brood en beleg.", "Leg een boterham op je bord.", "Doe beleg op de boterham.", "Leg alles terug op de plek.", "Eet rustig en drink iets."] },
        { category: "Thuis", title: "Mijn kamer opruimen", steps: ["Kies één klein stukje van je kamer.", "Leg afval in de prullenbak.", "Leg kleren op één plek.", "Leg spullen terug op hun vaste plek.", "Klaar. Je hoeft niet alles tegelijk te doen."] },
        { category: "Thuis", title: "De was doen", steps: ["Leg vuile kleren bij elkaar.", "Doe de kleren in de wasmachine.", "Vraag zo nodig hulp met het wasmiddel.", "Kies het programma dat je hebt afgesproken.", "Haal de was eruit als de machine klaar is."] },
        { category: "Onderweg", title: "Klaarmaken om naar buiten te gaan", steps: ["Kijk wat voor weer het is.", "Pak je jas en je tas.", "Doe je jas aan.", "Pak je sleutels en telefoon.", "Kijk of je alles hebt. Je kunt nu gaan."] },
        { category: "Onderweg", title: "Naar een afspraak gaan", steps: ["Kijk hoe laat de afspraak is.", "Kijk waar je moet zijn.", "Leg je spullen klaar.", "Vertrek op tijd. Vraag hulp als je de weg niet weet.", "Zeg bij aankomst dat je er bent."] },
        { category: "Afspraken", title: "Een afspraak voorbereiden", steps: ["Schrijf op waar de afspraak over gaat.", "Schrijf vragen op die je wilt stellen.", "Neem je afsprakenkaart of andere spullen mee.", "Je mag vragen of iemand iets rustig herhaalt.", "Vraag aan het einde wat er is afgesproken."] },
        { category: "Contact", title: "Iemand bellen", steps: ["Bedenk wat je wilt zeggen.", "Zoek het telefoonnummer op.", "Bel de persoon.", "Zeg je naam en waarom je belt.", "Luister. Vraag of iemand het rustig wil herhalen als dat nodig is."] },
        { category: "Contact", title: "Hulp vragen", steps: ["Denk na over wat moeilijk is.", "Kies iemand die je vertrouwt.", "Zeg: ik heb hulp nodig met…", "Vertel één ding tegelijk.", "Vraag wat de volgende stap is."] },
        { category: "Geld en boodschappen", title: "Boodschappen doen", steps: ["Maak een lijstje van wat je nodig hebt.", "Neem je tas en betaalmiddel mee.", "Pak de spullen van je lijstje.", "Kijk wat de prijs is voordat je iets koopt.", "Betaal en bewaar je bonnetje als je dat wilt."] },
        { category: "Veiligheid", title: "Iemand vraagt om mijn code of wachtwoord", steps: ["Stop even. Deel je code of wachtwoord niet.", "Klik niet op een link als je twijfelt.", "Bel zelf iemand die je vertrouwt op een bekend nummer.", "Vraag die persoon om mee te kijken.", "Bij direct gevaar: ga naar een veilige plek en bel 112."] },
        { category: "Veiligheid", title: "Ik voel mij niet veilig", steps: ["Ga als dat kan naar een plek met andere mensen.", "Zeg duidelijk: stop, ik wil dit niet.", "Bel iemand die je vertrouwt.", "Laat je hulpkaart zien als praten moeilijk is.", "Bij direct gevaar: bel 112."] },
        { category: "Rust en overzicht", title: "Mijn avond rustig afsluiten", steps: ["Leg kleren voor morgen klaar.", "Leg je telefoon op de afgesproken plek.", "Poets je tanden.", "Kies iets rustigs om te doen.", "Ga naar bed wanneer dat voor jou werkt."] }
      ];
      var state = loadState();
      var page = "today";
      var taskIndex = -1;
      var stepIndex = 0;
      var selectedSkillCategory = "Alles";
      var taskSearch = "";
      var selectedNeed = "";
      var breathingTimer = null;
      var deleteIndex = -1;
      var groundStep = 0;

      function dayKey() {
        var d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      }
      function loadState() {
        var saved = {};
        try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) {}
        var today = dayKey();
        var plans = saved.plans && typeof saved.plans === "object" ? saved.plans : {};
        if (!saved.plans && Array.isArray(saved.plan)) plans[today] = saved.plan;
        if (!plans[today]) plans[today] = examplePlan.map(function (item) { return Object.assign({}, item); });
        var selectedDate = today;
        var moods = saved.moods && typeof saved.moods === "object" ? saved.moods : {};
        if (!saved.moods && saved.mood) moods[saved.moodDay || today] = saved.mood;
        var sensoryByDay = saved.sensoryByDay && typeof saved.sensoryByDay === "object" ? saved.sensoryByDay : {};
        if (!saved.sensoryByDay && Array.isArray(saved.sensorySignals)) sensoryByDay[today] = saved.sensorySignals;
        var result = {
          name: saved.name || "",
          selectedDate: selectedDate,
          plans: plans,
          plan: Array.isArray(plans[selectedDate]) ? plans[selectedDate] : [],
          moods: moods,
          mood: moods[selectedDate] || "",
          moodDay: selectedDate,
          moodHistory: Array.isArray(saved.moodHistory) ? saved.moodHistory : [],
          contactName: saved.contactName || "",
          contactPhone: saved.contactPhone || "",
          contacts: Array.isArray(saved.contacts) ? saved.contacts : [],
          note: saved.note || "",
          earlySigns: saved.earlySigns || "",
          calmingPlan: saved.calmingPlan || "",
          safePlace: saved.safePlace || "",
          sensoryByDay: sensoryByDay,
          sensorySignals: Array.isArray(sensoryByDay[selectedDate]) ? sensoryByDay[selectedDate] : [],
          scale: Number(saved.scale) || 0,
          contrast: Boolean(saved.contrast),
          darkMode: Boolean(saved.darkMode),
          simpleHome: Boolean(saved.simpleHome),
          example: typeof saved.example === "boolean" ? saved.example : !Array.isArray(saved.plan),
          customTasks: Array.isArray(saved.customTasks) ? saved.customTasks : [],
          goals: Array.isArray(saved.goals) ? saved.goals : [],
          budgetLimit: Number(saved.budgetLimit) || 0,
          expenses: Array.isArray(saved.expenses) ? saved.expenses : [],
          preferences: saved.preferences || {},
          onboarded: Boolean(saved.onboarded)
        };
        return result;
      }
      function save() {
        try {
          state.plans[state.selectedDate] = state.plan;
          state.moods[state.selectedDate] = state.mood;
          state.sensoryByDay[state.selectedDate] = state.sensorySignals;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          return true;
        } catch (e) {
          setStatus("Opslaan lukte niet. Controleer de opslagruimte op je telefoon.");
          return false;
        }
      }
      function esc(value) {
        return String(value).replace(/[&<>"']/g, function (character) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character];
        });
      }
      function name() { return state.name.trim() || "Jij"; }
      function bodyScale() { return 1 + state.scale * 0.12; }
      function dateText() {
        return new Intl.DateTimeFormat("nl-NL", { weekday: "long", day: "numeric", month: "long" }).format(new Date(state.selectedDate + "T12:00:00"));
      }
      function selectDate(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return;
        state.plans[state.selectedDate] = state.plan;
        state.selectedDate = value;
        state.plan = Array.isArray(state.plans[value]) ? state.plans[value] : [];
        state.mood = state.moods[value] || "";
        state.moodDay = value;
        state.sensorySignals = Array.isArray(state.sensoryByDay[value]) ? state.sensoryByDay[value] : [];
        save();
        render();
      }
      function shiftDate(days) {
        var date = new Date(state.selectedDate + "T12:00:00");
        date.setDate(date.getDate() + days);
        selectDate(date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0"));
      }
      function copyPreviousPlan() {
        var previous = new Date(state.selectedDate + "T12:00:00");
        previous.setDate(previous.getDate() - 1);
        var key = previous.getFullYear() + "-" + String(previous.getMonth() + 1).padStart(2, "0") + "-" + String(previous.getDate()).padStart(2, "0");
        if (!state.plans[key] || state.plans[key].length === 0) {
          openDialog("Geen planning gevonden", "<p>De vorige dag heeft geen activiteiten om te kopiëren.</p>" + btn("Sluiten", "close-dialog", true));
          return;
        }
        state.plan = state.plans[key].map(function (item) {
          return Object.assign({}, item, { done: false, reminder: 0, reminderId: "" });
        });
        state.example = false;
        save();
        render();
      }
      function greeting() {
        var hour = new Date().getHours();
        return hour < 12 ? "Goedemorgen" : (hour < 18 ? "Goedemiddag" : "Goedenavond");
      }
      function setStatus(message) {
        var node = document.getElementById("status");
        if (node) node.textContent = message;
      }
      function applyPreferences() {
        document.documentElement.style.setProperty("--scale", String(bodyScale()));
        document.body.classList.toggle("high-contrast", state.contrast);
        document.body.classList.toggle("dark-mode", state.darkMode);
      }
      function render() {
        applyPreferences();
        document.querySelectorAll("nav [data-page]").forEach(function (button) {
          if (button.dataset.page === page) button.setAttribute("aria-current", "page");
          else button.removeAttribute("aria-current");
        });
        var main = document.getElementById("main");
        if (page === "today") renderToday(main);
        if (page === "day") renderPlan(main);
        if (page === "skills") renderSkills(main);
        if (page === "rest") renderRest(main);
        if (page === "together") renderTogether(main);
        window.scrollTo(0, 0);
      }
      function card(title, content, extraClass) {
        return '<section class="card ' + (extraClass || "") + '"><h2>' + title + '</h2>' + content + '</section>';
      }
      function btn(label, action, primary, pressed) {
        return '<button type="button" data-action="' + action + '"' +
          (pressed === null || typeof pressed === "undefined" ? "" : ' aria-pressed="' + (pressed ? "true" : "false") + '"') +
          (primary ? ' class="primary"' : "") + '>' + label + '</button>';
      }
      function renderToday(main) {
        var done = state.plan.filter(function (item) { return item.done; }).length;
        var next = state.plan.find(function (item) { return !item.done; });
        var greetingText = '<h1>' + greeting() + ', ' + esc(name()) + '.</h1>' +
          '<p class="intro">Fijn dat je er bent. Je hoeft niet alles tegelijk te doen.</p>' +
          '<p class="small">' + esc(dateText()) + '</p>';
        var dayContent = '<p>' + done + ' van ' + state.plan.length + ' activiteiten klaar</p>' +
          '<div class="progress-track" role="progressbar" aria-label="Voortgang van vandaag" aria-valuemin="0" aria-valuemax="' + Math.max(1, state.plan.length) + '" aria-valuenow="' + done + '">' +

        var note = existing ? existing.note || "" : "";
        var reminder = existing ? Number(existing.reminder || 0) : 0;
        var content = '<label class="field" for="activity-title">Wat ga je doen?<input id="activity-title" maxlength="70" value="' + esc(title) + '" autocomplete="off"></label>' +
          '<label class="field" for="activity-time">Tijd (bijvoorbeeld 09:30)<input id="activity-time" type="time" value="' + esc(time) + '"></label>' +
          '<label class="field" for="activity-place">Waar? (optioneel)<input id="activity-place" maxlength="100" value="' + esc(place) + '"></label>' +
          '<label class="field" for="activity-person">Met wie? (optioneel)<input id="activity-person" maxlength="100" value="' + esc(person) + '"></label>' +
          '<label class="field" for="activity-note">Wat moet ik weten? (optioneel)<textarea id="activity-note" maxlength="300">' + esc(note) + '</textarea></label>' +
          '<label class="field" for="activity-reminder">Seintje vooraf<select id="activity-reminder">' +
          '<option value="0"' + (reminder === 0 ? " selected" : "") + '>Geen seintje</option>' +
          '<option value="5"' + (reminder === 5 ? " selected" : "") + '>5 minuten vooraf</option>' +
          '<option value="15"' + (reminder === 15 ? " selected" : "") + '>15 minuten vooraf</option>' +
          '</select></label>' +
          '<div class="status" id="status" role="status"></div>' +
          btn("Bewaar activiteit", "save-item:" + index, true) + btn("Annuleer", "close-dialog", false);
        openDialog(existing ? "Activiteit aanpassen" : "Activiteit toevoegen", content, "activity-title");
      }
      function showDeleteDialog(index) {
        deleteIndex = index;
        var content = '<p>Wil je <strong>' + esc(state.plan[index].title) + '</strong> uit je planning halen?</p>' +
          btn("Ja, verwijder", "confirm-delete", true) + btn("Annuleer", "close-dialog", false);
        openDialog("Activiteit verwijderen?", content);
      }
      function showTaskEditor(index) {
        var existing = index >= 0 ? state.customTasks[index] : null;
        var steps = existing ? existing.steps.join("\n") : "";
        var content = '<label class="field" for="custom-task-title">Naam van de taak<input id="custom-task-title" maxlength="70" value="' + esc(existing ? existing.title : "") + '"></label>' +
          '<label class="field" for="custom-task-category">Soort taak<input id="custom-task-category" maxlength="50" value="' + esc(existing ? existing.category : "Mijn stappenplan") + '"></label>' +
          '<label class="field" for="custom-task-steps">Schrijf één stap per regel<textarea id="custom-task-steps" maxlength="1200" placeholder="Pak je spullen.\nKijk wat je nodig hebt.\nVraag hulp als dat nodig is.">' + esc(steps) + '</textarea></label>' +
          '<p class="small">Je kunt later altijd iets veranderen.</p>' +
          '<div class="status" id="status" role="status"></div>' +
          btn("Bewaar stappenplan", "save-custom-task:" + index, true) + btn("Annuleer", "close-dialog", false);
        openDialog(existing ? "Stappenplan aanpassen" : "Mijn stappenplan", content, "custom-task-title");
      }
      function saveCustomTask(index) {
        var title = document.getElementById("custom-task-title").value.trim();
        var category = document.getElementById("custom-task-category").value.trim() || "Mijn stappenplan";
        var steps = document.getElementById("custom-task-steps").value.split(/\r?\n/).map(function (step) { return step.trim(); }).filter(Boolean);
        if (!title || steps.length < 2) {
          setStatus("Vul een naam in en schrijf minstens twee stappen op.");
          if (!title) document.getElementById("custom-task-title").focus();
          else document.getElementById("custom-task-steps").focus();
          return;
        }
        var task = { title: title, category: category, steps: steps, isCustom: true };
        if (index >= 0 && state.customTasks[index]) state.customTasks[index] = task;
        else state.customTasks.push(task);
        save(); closeDialog(); render();
      }
      function showGoalDialog() {
        openDialog("Een klein doel", '<p>Wat wil jij oefenen of graag doen?</p>' +
          '<label class="field" for="goal-title">Mijn doel<input id="goal-title" maxlength="90" placeholder="Bijvoorbeeld: zelf een boterham maken"></label>' +
          btn("Bewaar mijn doel", "save-goal", true) + btn("Annuleer", "close-dialog", false), "goal-title");
      }
      function saveGoal() {
        var title = document.getElementById("goal-title").value.trim();
        if (!title) { document.getElementById("goal-title").focus(); return; }
        state.goals.push({ title: title, done: false });
        save(); closeDialog(); render();
      }
      function showBudgetDialog() {
        openDialog("Mijn maandbedrag", '<p>Vul het bedrag in dat jij zelf wilt gebruiken als overzicht.</p>' +
          '<label class="field" for="budget-limit">Bedrag in euro’s<input id="budget-limit" type="number" inputmode="decimal" min="0" step="0.01" value="' +
          (state.budgetLimit ? esc(state.budgetLimit) : '') + '"></label>' +
          '<div class="status" id="status" role="status"></div>' +
          btn("Bewaar bedrag", "save-budget", true) + btn("Annuleer", "close-dialog", false), "budget-limit");
      }
      function saveBudget() {
        var value = Number(document.getElementById("budget-limit").value);
        if (!Number.isFinite(value) || value < 0) { setStatus("Vul een bedrag van nul of hoger in."); return; }
        state.budgetLimit = value;
        save(); closeDialog(); render();
      }
      function showExpenseDialog() {
        openDialog("Een uitgave noteren", '<label class="field" for="expense-title">Waar was de uitgave voor?<input id="expense-title" maxlength="80"></label>' +
          '<label class="field" for="expense-amount">Bedrag in euro’s<input id="expense-amount" type="number" inputmode="decimal" min="0.01" step="0.01"></label>' +
          '<div class="status" id="status" role="status"></div>' +
          btn("Bewaar uitgave", "save-expense", true) + btn("Annuleer", "close-dialog", false), "expense-title");
      }
      function saveExpense() {
        var title = document.getElementById("expense-title").value.trim();
        var amount = Number(document.getElementById("expense-amount").value);
        if (!title || !Number.isFinite(amount) || amount <= 0) {
          setStatus("Vul een naam en een bedrag groter dan nul in.");
          return;
        }
        state.expenses.push({ title: title, amount: Math.round(amount * 100) / 100, date: state.selectedDate });
        save(); closeDialog(); render();
      }
      function showSharePreview() {
        var content = '<p>Dit is de tekst die je gaat delen:</p><div class="help-copy">' + esc(helpCardText()).replace(/\n/g, "<br>") + '</div>' +
          '<p class="small">Kies zelf met welke app of persoon je dit deelt.</p>' +
          btn("Ja, kies waar ik dit deel", "share", true) + btn("Annuleer", "close-dialog", false);
        openDialog("Mijn hulpkaart delen", content);
      }
      function communicationPhrases() {
        return [
          "Ik begrijp het niet. Wil je het rustig nog een keer zeggen?",
          "Ik heb meer tijd nodig om na te denken.",
          "Ik wil graag even pauze.",
          "Dit is te veel voor mij.",
          "Ik wil nu nee zeggen.",
          "Wil je opschrijven wat we hebben afgesproken?"
        ];
      }
      function showPhrase(index) {
        var phrase = communicationPhrases()[index];
        if (!phrase) return;
        openDialog("Ik wil zeggen…", '<div class="breath-word">' + esc(phrase) + '</div>' +
          btn("Lees deze zin voor", "speak-phrase:" + index, false) + btn("Sluiten", "close-dialog", true));
      }
      function showExportPreview() {
        openDialog("Mijn gegevens exporteren", '<p>Dit bestand kan je planning, gevoelens, doelen, contactgegevens en rustplan bevatten.</p>' +
          '<p>Bewaar het alleen op een plek die jij vertrouwt.</p>' +
          btn("Ja, kies waar ik mijn bestand deel", "export-data", true) + btn("Annuleer", "close-dialog", false));
      }
      function exportData() {
        state.plans[state.selectedDate] = state.plan;
        var exportText = JSON.stringify({ format: "SAMENWIJS", version: 1, exportedAt: new Date().toISOString(), data: state }, null, 2);
        if (window.NativeApp && window.NativeApp.shareText) window.NativeApp.shareText(exportText);
        else if (navigator.share) navigator.share({ title: "Mijn SAMENWIJS-gegevens", text: exportText }).catch(function () {});
        closeDialog();
      }
      var groundingWords = [
        "Kijk rustig om je heen. Noem 5 dingen die je ziet.",
        "Merk 4 dingen op die je kunt voelen.",
        "Luister naar 3 geluiden.",
        "Merk 2 geuren op. Je mag ook niets ruiken.",
        "Merk 1 smaak op. Je mag stoppen wanneer je wilt."
      ];
      function showGrounding() {
        groundStep = 0;
        renderGroundingDialog();
      }
      function renderGroundingDialog() {
        var done = groundStep >= groundingWords.length;
        var word = done ? "De oefening is klaar. Je mag verder wanneer je wilt." : groundingWords[groundStep];
        var actions = done
          ? btn("Klaar", "close-dialog", true)
          : (groundStep > 0 ? btn("Vorige", "ground-prev", false) : "") +
            btn(groundStep === groundingWords.length - 1 ? "Klaar" : "Volgende", "ground-next", true) +
            btn("Stop", "close-dialog", false);
        openDialog("Even hier zijn", '<p>Je kunt dit doen of overslaan. Er is geen haast.</p><div class="breath-word">' + esc(word) + '</div>' + actions);
      }
      function showBreathing() {
        var content = '<p>Adem rustig in. Adem rustig uit. Stop wanneer je wilt.</p>' +
          '<div id="breath-word" class="breath-word" aria-live="polite">Adem rustig in</div>' +
          '<div id="breath-time" class="breath-time" aria-live="off">60 seconden</div>' +
          btn("Stop", "close-dialog", false);
        openDialog("Rustig ademen", content, "breath-word");
        var remaining = 60;
        breathingTimer = setInterval(function () {
          remaining -= 1;
          var word = document.getElementById("breath-word");
          var time = document.getElementById("breath-time");
          if (!word || !time) { clearInterval(breathingTimer); breathingTimer = null; return; }
          if (remaining <= 0) {
            word.textContent = "De oefening is klaar.";
            time.textContent = "Goed gedaan. Je mag verder met je dag.";
            clearInterval(breathingTimer);
            breathingTimer = null;
            return;
          }
          var position = (60 - remaining) % 10;
          word.textContent = position < 4 ? "Adem rustig in" : "Adem rustig uit";
          time.textContent = remaining + " seconden";
        }, 1000);
      }
      function showResetConfirmation() {
        openDialog("Al je gegevens wissen?", '<p>Je planning, gevoel en hulpkaart worden van dit toestel verwijderd.</p>' +
          btn("Ja, wis alles", "reset-data", true) + btn("Annuleer", "close-dialog", false));
      }
      function saveSettings() {
        state.name = document.getElementById("person-name").value.trim();
        var checked = document.querySelector('input[name="scale"]:checked');
        state.scale = checked ? Number(checked.value) : 0;
        state.contrast = document.getElementById("high-contrast").checked;
        state.darkMode = document.getElementById("dark-mode").checked;
        state.contactName = document.getElementById("contact-name").value.trim();
        state.contactPhone = document.getElementById("contact-phone").value.trim();
        state.contacts = [0, 1].map(function (index) {
          return {
            name: document.getElementById("extra-contact-name-" + index).value.trim(),
            phone: document.getElementById("extra-contact-phone-" + index).value.trim()
          };
        }).filter(function (contact) { return contact.name || contact.phone; });
        state.note = document.getElementById("personal-note").value.trim();
        state.earlySigns = document.getElementById("early-signs").value.trim();
        state.calmingPlan = document.getElementById("calming-plan").value.trim();
        state.safePlace = document.getElementById("safe-place").value.trim();
        state.simpleHome = document.getElementById("simple-home").checked;
        save();
        closeDialog();
        render();
      }
      function saveItem(index) {
        var titleField = document.getElementById("activity-title");
        var timeField = document.getElementById("activity-time");
        var title = titleField.value.trim();
        titleField.setCustomValidity("");
        timeField.setCustomValidity("");
        if (!title) { titleField.focus(); titleField.setCustomValidity("Vul een activiteit in."); titleField.reportValidity(); return; }
        if (!timeField.value) { timeField.focus(); timeField.reportValidity(); return; }
        var oldReminderId = index >= 0 && state.plan[index] ? state.plan[index].reminderId || "" : "";
        var item;
        if (index >= 0 && state.plan[index]) {
          item = state.plan[index];
          item.title = title;
          item.time = timeField.value;
          item.place = document.getElementById("activity-place").value.trim();
          item.person = document.getElementById("activity-person").value.trim();
          item.note = document.getElementById("activity-note").value.trim();
          item.reminder = Number(document.getElementById("activity-reminder").value);
        } else {
          item = {
            title: title,
            time: timeField.value,
            place: document.getElementById("activity-place").value.trim(),
            person: document.getElementById("activity-person").value.trim(),
            note: document.getElementById("activity-note").value.trim(),
            reminder: Number(document.getElementById("activity-reminder").value),
            done: false
          };
          state.plan.push(item);
          state.example = false;
        }
        item.reminderId = item.reminder > 0 ? reminderId(item) : "";
        state.plan.sort(function (a, b) { return String(a.time).localeCompare(String(b.time)); });
        save();
        scheduleEventReminder(item, oldReminderId);
        closeDialog();
        render();
      }
      function reminderId(item) {
        return "sw-" + state.selectedDate + "-" + item.time + "-" + item.title;
      }
      function scheduleEventReminder(item, oldReminderId) {
        if (!window.NativeApp) return;
        if (oldReminderId && oldReminderId !== item.reminderId && window.NativeApp.cancelReminder) {
          window.NativeApp.cancelReminder(oldReminderId);
        }
        if (!item.reminder || item.done || !window.NativeApp.scheduleReminder) {
          if (item.reminderId && window.NativeApp.cancelReminder) window.NativeApp.cancelReminder(item.reminderId);
          return;
        }
        var trigger = new Date(state.selectedDate + "T" + item.time + ":00").getTime() - Number(item.reminder) * 60000;
        if (trigger <= Date.now()) {
          if (window.NativeApp.cancelReminder) window.NativeApp.cancelReminder(item.reminderId);
          return;
        }
        window.NativeApp.scheduleReminder(item.reminderId, item.title, trigger, Number(item.reminder));
      }
      function shareCard() {
        var text = helpCardText();
        closeDialog();
        if (window.NativeApp && window.NativeApp.shareText) window.NativeApp.shareText(text);
        else if (navigator.share) navigator.share({ title: "Mijn hulpkaart", text: text }).catch(function () {});
        else setStatus("Delen kan via de deelopties van je telefoon.");
      }
      function helpCardText() {
        var text = "Mijn hulpkaart — " + name() + "\n\nIk heb extra tijd nodig. Praat rustig en gebruik korte zinnen. Vertel stap voor stap wat er gaat gebeuren.";
        if (state.earlySigns.trim()) text += "\n\nIk merk spanning aan: " + state.earlySigns.trim();
        if (state.calmingPlan.trim()) text += "\n\nDit helpt mij: " + state.calmingPlan.trim();
        if (state.safePlace.trim()) text += "\n\nMijn rustige plek is: " + state.safePlace.trim();
        if (state.note.trim()) text += "\n\nDit helpt mij ook: " + state.note.trim();
        getContacts().forEach(function (contact) {
          text += "\n\nMijn vertrouwde contact: " + (contact.name || "Vertrouwd contact") + (contact.phone ? " — " + contact.phone : "");
        });
        return text;
      }
      function go(pageName) {
        if (pageName === "today") selectDate(dayKey());
        page = pageName; taskIndex = -1; selectedNeed = ""; render();
      }
      function handleAction(action) {
        var parts = action.split(":");
        var name = parts[0];
        var index = Number(parts[1]);
        if (name === "go-day") return go("day");
        if (name === "go-skills") return go("skills");
        if (name === "go-together") return go("together");
        if (name === "go-rest") return go("rest");
        if (name === "date-prev") return shiftDate(-1);
        if (name === "date-next") return shiftDate(1);
        if (name === "date-today") return selectDate(dayKey());
        if (name === "copy-prev") return copyPreviousPlan();
        if (name === "add-item") return showRoutineDialog(-1);
        if (name === "edit-item") return showRoutineDialog(index);
        if (name === "delete-item") return showDeleteDialog(index);
        if (name === "confirm-delete") {
          if (deleteIndex >= 0) {
            var removed = state.plan[deleteIndex];
            if (removed && removed.reminderId && window.NativeApp && window.NativeApp.cancelReminder)
              window.NativeApp.cancelReminder(removed.reminderId);
            state.plan.splice(deleteIndex, 1);
          }
          state.example = false; save(); closeDialog(); return render();
        }
        if (name === "save-item") return saveItem(index);
        if (name === "close-dialog") return closeDialog();
        if (name === "save-settings") return saveSettings();
        if (name === "complete-onboarding") return completeOnboarding();
        if (name === "export-preview") return showExportPreview();
        if (name === "export-data") return exportData();
        if (name === "reset-confirm") return showResetConfirmation();
        if (name === "reset-data") {
          if (window.NativeApp && window.NativeApp.cancelReminder) {
            Object.keys(state.plans).forEach(function (date) {
              (state.plans[date] || []).forEach(function (item) {
                if (item.reminderId) window.NativeApp.cancelReminder(item.reminderId);
              });
            });
          }
          localStorage.removeItem(STORAGE_KEY);
          window.location.reload();
          return;
        }
        if (name === "toggle-item" && state.plan[index]) {
          state.plan[index].done = !state.plan[index].done;
          scheduleEventReminder(state.plan[index]);
          save(); return render();
        }
        if ((name === "move-up" || name === "move-down") && state.plan[index]) {
          var destination = index + (name === "move-up" ? -1 : 1);
          if (destination >= 0 && destination < state.plan.length) {
            var moved = state.plan.splice(index, 1)[0]; state.plan.splice(destination, 0, moved);
            state.example = false; save(); return render();
          }
        }
        if (name === "start-task") { taskIndex = index; stepIndex = 0; return render(); }
        if (name === "next-step") { stepIndex += 1; return render(); }
        if (name === "prev-step") { stepIndex -= 1; return render(); }
        if (name === "finish-task" || name === "stop-task") {
          taskIndex = -1; stepIndex = 0; return render();
        }
        if (name === "mood") {
          state.mood = parts.slice(1).join(":"); state.moodDay = state.selectedDate;
          state.moodHistory = (state.moodHistory || []).filter(function (entry) { return entry.date !== state.selectedDate; });
          state.moodHistory.push({ date: state.selectedDate, mood: state.mood });
          state.moodHistory = state.moodHistory.slice(-90);
          save(); return render();
        }
        if (name === "need") { selectedNeed = parts[1]; return render(); }
        if (name === "signal") {
          var choices = ["Geluid voelt hard", "Licht is fel", "Veel mensen om mij heen", "Mijn planning is veranderd", "Ik ben moe", "Mijn lichaam voelt onrustig"];
          var signal = choices[index];
          if (signal) {
            var signalIndex = state.sensorySignals.indexOf(signal);
            if (signalIndex >= 0) state.sensorySignals.splice(signalIndex, 1);
            else state.sensorySignals.push(signal);
            save(); return render();
          }
        }
        if (name === "start-breath") return showBreathing();
        if (name === "grounding") return showGrounding();
        if (name === "ground-next") { groundStep += 1; return renderGroundingDialog(); }
        if (name === "ground-prev") { groundStep = Math.max(0, groundStep - 1); return renderGroundingDialog(); }
        if (name === "add-custom-task") return showTaskEditor(-1);
        if (name === "custom-editor") return showTaskEditor(index);
        if (name === "edit-custom-task") return showTaskEditor(index);
        if (name === "save-custom-task") return saveCustomTask(index);
        if (name === "delete-custom-task") {
          openDialog("Stappenplan verwijderen?", "<p>Wil je dit eigen stappenplan verwijderen?</p>" +
            btn("Ja, verwijder", "delete-custom-confirm:" + index, true) + btn("Annuleer", "close-dialog", false)); return;
        }
        if (name === "delete-custom-confirm") {
          state.customTasks.splice(index, 1); taskIndex = -1; save(); closeDialog(); return render();
        }
        if (name === "add-goal") return showGoalDialog();
        if (name === "save-goal") return saveGoal();
        if (name === "set-budget") return showBudgetDialog();
        if (name === "save-budget") return saveBudget();
        if (name === "add-expense") return showExpenseDialog();
        if (name === "save-expense") return saveExpense();
        if (name === "delete-expense") {
          openDialog("Uitgave verwijderen?", "<p>Wil je deze uitgave uit je overzicht halen?</p>" +
            btn("Ja, verwijder", "delete-expense-confirm:" + index, true) + btn("Annuleer", "close-dialog", false)); return;
        }
        if (name === "delete-expense-confirm") { state.expenses.splice(index, 1); save(); closeDialog(); return render(); }
        if (name === "toggle-goal" && state.goals[index]) {
          state.goals[index].done = !state.goals[index].done; save(); return render();
        }
        if (name === "delete-goal" && state.goals[index]) {
          openDialog("Doel verwijderen?", "<p>Wil je dit doel verwijderen?</p>" +
            btn("Ja, verwijder", "delete-goal-confirm:" + index, true) + btn("Annuleer", "close-dialog", false)); return;
        }
        if (name === "delete-goal-confirm") { state.goals.splice(index, 1); save(); closeDialog(); return render(); }
        if (name === "share-preview") return showSharePreview();
        if (name === "phrase") return showPhrase(index);
        if (name === "speak-phrase") {
          var phrase = communicationPhrases()[index];
          if (phrase && window.NativeApp && window.NativeApp.speakText) window.NativeApp.speakText(phrase);
          return;
        }
        if (name === "speak-step" && window.NativeApp && window.NativeApp.speakText && taskIndex >= 0) {
          var activeTask = allTasks()[taskIndex];
          if (activeTask && activeTask.steps[stepIndex]) window.NativeApp.speakText(activeTask.steps[stepIndex]);
          return;
        }
        if (name === "speak-help" && window.NativeApp && window.NativeApp.speakText) {
          window.NativeApp.speakText(helpCardText()); return;
        }
        if (name === "settings") return showSettings();
        if (name === "share") return shareCard();
        if (name === "dial") {
          var contactIndex = Number(parts[1] || 0);
          var contact = getContacts()[contactIndex];
          if (contact && contact.phone && window.NativeApp && window.NativeApp.dial) window.NativeApp.dial(contact.phone);
          return;
        }
      }
      document.addEventListener("click", function (event) {
        var pageButton = event.target.closest("[data-page]");
        if (pageButton) { go(pageButton.dataset.page); return; }
        var actionButton = event.target.closest("[data-action]");
        if (actionButton) handleAction(actionButton.dataset.action);
      });
      document.addEventListener("change", function (event) {
        if (event.target && event.target.id === "plan-date") selectDate(event.target.value);
        if (event.target && event.target.id === "skill-category") {
          selectedSkillCategory = event.target.value; render();
        }
      });
      document.addEventListener("input", function (event) {
        if (!event.target || event.target.id !== "task-search") return;
        taskSearch = event.target.value;
        var query = taskSearch.trim().toLowerCase();
        document.querySelectorAll("[data-task-card]").forEach(function (taskCard) {
          taskCard.hidden = query && taskCard.dataset.taskTitle.indexOf(query) < 0;
        });
      });
      document.getElementById("settings-open").addEventListener("click", showSettings);
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && document.querySelector(".overlay")) closeDialog();
      });
      window.samenwijsBack = function () {
        if (document.querySelector(".overlay")) { closeDialog(); return true; }
        if (page !== "today") { go("today"); return true; }
        return false;
      };
      applyPreferences();
      save();
      render();
      if (!state.onboarded) showWelcome();
    })();
  </script>
</body>
</html>
